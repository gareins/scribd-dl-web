[SCRIBD]
rendertime=100
retries=3
skip_on_error=true

[IMAGE]
; image codec used for rendered pages inside the assembled pdf
; png (lossless, larger) or jpeg (lossy, smaller)
format=jpeg
jpeg_quality=85
jpeg_chroma_subsampling=4:2:0
; capture resolution in pixels per CSS pixel. 2 would be sharper but each step is
; 4x more memory; lowered to 1 due to low memory on vps
device_scale_factor=1

[DIRECTORY]
; where downloaded artifacts live; override with the OUTPUT_DIR env var
output=output
filename=title
