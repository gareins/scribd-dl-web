[SCRIBD]
rendertime=100
retries=3
skip_on_error=true

[IMAGE]
; image codec used for rendered pages inside the assembled pdf
; png (lossless, larger) or jpeg (lossy, smaller)
format=jpeg
jpeg_quality=85
jpeg_chroma_subsampling=4:2:0

[DIRECTORY]
; where downloaded artifacts live; override with the OUTPUT_DIR env var
output=output
filename=title